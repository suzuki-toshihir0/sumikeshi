name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run test

      - run: npm run build

      - run: npx playwright install --with-deps
      - run: npm run test:e2e

      # 画面の性質の試験（Bombadil、3 分）。Chrome は、上で Playwright が入れた Chromium を使う
      - name: 画面の性質の試験（Bombadil）
        run: CHROME="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run test:pbt

      # 性質が破れたら、トレース（スクリーンショット入り）を残す。`npx bombadil browser inspect pbt.bin` で見られる
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bombadil-trace
          path: test-results/pbt.bin
          if-no-files-found: ignore
